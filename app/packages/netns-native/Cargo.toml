[package]
name = "radium226-vpn-passthrough-netns-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "netns_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rtnetlink = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
futures = "0.3"
nix = { version = "0.31", features = ["sched", "process"] }
